name: CI
on:
  push:
    branches: [main, "feat/**", "design/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @awc/mcp-ui build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm operations:demo
      - run: pnpm standards:demo
      - run: pnpm --filter @awc/server bundle
      - run: pnpm --filter @awc/example-remote-executor bundle
